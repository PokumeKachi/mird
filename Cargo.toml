[package]
name = "mird"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.0", features = ["dynamic_linking"] }
log = { version = "*", features = [
  "max_level_debug",
  "release_max_level_warn",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
opt-level = "s"
strip = "debuginfo"
